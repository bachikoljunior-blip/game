<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="description" content="LUMINA — 片手で遊べるネオン・サバイバーアクション。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUMINA">
<title>LUMINA — ルミナ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="game view"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden" aria-hidden="true">
    <div class="hud-top">
      <div class="bars">
        <div class="bar hp"><i id="hpFill"></i><span id="hpText">100/100</span></div>
        <div class="bar xp"><i id="xpFill"></i><span id="xpText">Lv.1</span></div>
      </div>
      <div class="hud-stats">
        <div class="clock" id="clock">00:00</div>
        <div class="chips">
          <span class="chip kills"><b id="kills">0</b></span>
          <span class="chip shards"><b id="shards">0</b></span>
        </div>
      </div>
      <button id="btnPause" class="icon-btn" aria-label="pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>

    <div class="hud-loadout" id="loadout"></div>

    <div id="alerts" aria-live="polite"></div>

    <div class="hud-bottom">
      <button id="btnBurst" class="burst" aria-label="burst">
        <svg viewBox="0 0 48 48" class="burst-glyph"><path d="M24 4l4.6 12.2L41 12l-6.4 11.6L46 28l-13 1.4L35 42l-11-7-11 7 2-12.6L2 28l11.4-4.4L7 12l12.4 4.2z"/></svg>
        <svg viewBox="0 0 44 44" class="burst-ring"><circle cx="22" cy="22" r="20"/></svg>
        <span class="burst-cd" id="burstCd"></span>
      </button>
    </div>
  </div>

  <!-- ============ OVERLAYS ============ -->
  <div id="overlay">

    <!-- Title -->
    <section id="scr-title" class="screen show">
      <div class="logo-wrap">
        <canvas id="logoCanvas" width="620" height="260" aria-label="LUMINA"></canvas>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div class="menu">
        <button class="btn primary big" id="btnPlay"><span data-i18n="play"></span><em id="playSub"></em></button>
        <div class="menu-row">
          <button class="btn" id="btnChars"><span data-i18n="pilots"></span></button>
          <button class="btn" id="btnShop"><span data-i18n="lab"></span></button>
        </div>
        <div class="menu-row">
          <button class="btn ghost" id="btnCodex"><span data-i18n="codex"></span></button>
          <button class="btn ghost" id="btnOptions"><span data-i18n="options"></span></button>
        </div>
      </div>
      <div class="title-foot">
        <span class="shard-count"><b id="titleShards">0</b></span>
        <span class="best" id="titleBest"></span>
        <button id="btnEndless" class="toggle hidden"><span data-i18n="endless"></span><i></i></button>
      </div>
    </section>

    <!-- Character select -->
    <section id="scr-chars" class="screen sheet">
      <header class="sheet-head"><h2 data-i18n="pilots"></h2><button class="close" data-close aria-label="close">✕</button></header>
      <div class="sheet-body"><div id="charList" class="card-grid"></div></div>
      <footer class="sheet-foot"><button class="btn primary" id="btnCharGo"><span data-i18n="deploy"></span></button></footer>
    </section>

    <!-- Meta shop -->
    <section id="scr-shop" class="screen sheet">
      <header class="sheet-head">
        <h2 data-i18n="lab"></h2>
        <span class="shard-count big"><b id="shopShards">0</b></span>
        <button class="close" data-close aria-label="close">✕</button>
      </header>
      <div class="sheet-body"><div id="shopList" class="shop-grid"></div></div>
      <footer class="sheet-foot">
        <button class="btn ghost small" id="btnRespec"><span data-i18n="respec"></span></button>
        <button class="btn" data-close><span data-i18n="back"></span></button>
      </footer>
    </section>

    <!-- Codex / stats -->
    <section id="scr-codex" class="screen sheet">
      <header class="sheet-head"><h2 data-i18n="codex"></h2><button class="close" data-close aria-label="close">✕</button></header>
      <div class="sheet-body" id="codexBody"></div>
      <footer class="sheet-foot"><button class="btn" data-close><span data-i18n="back"></span></button></footer>
    </section>

    <!-- Options -->
    <section id="scr-options" class="screen sheet">
      <header class="sheet-head"><h2 data-i18n="options"></h2><button class="close" data-close aria-label="close">✕</button></header>
      <div class="sheet-body" id="optionsBody"></div>
      <footer class="sheet-foot"><button class="btn" data-close><span data-i18n="back"></span></button></footer>
    </section>

    <!-- Level up -->
    <section id="scr-levelup" class="screen modal">
      <div class="lu-head">
        <span class="lu-kicker" data-i18n="levelUp"></span>
        <h2 id="luTitle">Lv.2</h2>
      </div>
      <div id="luCards" class="lu-cards"></div>
      <div class="lu-tools">
        <button class="btn ghost small" id="btnReroll"><span data-i18n="reroll"></span> <b id="rerollN">0</b></button>
        <button class="btn ghost small" id="btnBanish"><span data-i18n="banish"></span> <b id="banishN">0</b></button>
        <button class="btn ghost small" id="btnSkip"><span data-i18n="skip"></span></button>
      </div>
    </section>

    <!-- Chest reward -->
    <section id="scr-chest" class="screen modal">
      <div class="lu-head"><span class="lu-kicker" data-i18n="cache"></span><h2 id="chestTitle"></h2></div>
      <div id="chestList" class="chest-list"></div>
      <button class="btn primary" id="btnChestOk"><span data-i18n="claim"></span></button>
    </section>

    <!-- Pause -->
    <section id="scr-pause" class="screen modal">
      <h2 class="pause-title" data-i18n="paused"></h2>
      <div id="pauseBuild" class="build-view"></div>
      <div class="menu">
        <button class="btn primary" id="btnResume"><span data-i18n="resume"></span></button>
        <button class="btn ghost" id="btnQuit"><span data-i18n="abandon"></span></button>
      </div>
    </section>

    <!-- Results -->
    <section id="scr-results" class="screen sheet">
      <header class="sheet-head"><h2 id="resTitle"></h2></header>
      <div class="sheet-body">
        <div id="resStats" class="res-stats"></div>
        <div id="resBuild" class="build-view"></div>
        <div id="resUnlocks"></div>
      </div>
      <footer class="sheet-foot">
        <button class="btn" id="btnResHome"><span data-i18n="home"></span></button>
        <button class="btn primary" id="btnResAgain"><span data-i18n="again"></span></button>
      </footer>
    </section>

  </div>

  <div id="fxflash"></div>
  <div id="vignette"></div>
  <div id="boot"><div class="boot-core"></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
